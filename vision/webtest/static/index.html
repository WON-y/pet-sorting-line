<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카메라 인식 테스트</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#d9dde3;--text:#1f2328;--muted:#5f6670;--soft:#eceff3;
        --ok:#2e7d5a;--ng:#b42318;--co:#2563eb;--re:#b7791f;--accent:#2563eb}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b1f24;--line:#30363d;--text:#e6e8eb;--muted:#9aa3ad;--soft:#252a31}}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0}
  .tag{font-size:12.5px;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .stage{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  .stage video,.stage img{width:100%;height:100%;object-fit:contain}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .placeholder{color:#9aa3ad;font-size:14px;text-align:center;padding:20px;position:absolute}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
  button,select,label.btn{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  select{max-width:100%}
  .row{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
  input[type=file]{display:none}
  .note{font-size:13px;color:var(--re);margin-top:10px;line-height:1.5}
  .badge{display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:10px;padding:18px 10px;color:#fff;background:#9ca3af;min-height:120px;text-align:center}
  .badge .code{font-size:40px;font-weight:800;letter-spacing:1px}
  .badge .name{font-size:15px;margin-top:4px;opacity:.95}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:10px 0 4px}
  h2{font-size:15px;margin:16px 0 8px}
  .bar{margin:6px 0}
  .bar .lbl{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
  .bar .lbl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .track{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:3px}
  .bar .fill{height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
  .history{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
  .history figure{margin:0;font-size:12px;color:var(--muted)}
  .history img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:3px solid var(--line);display:block}
  .history figcaption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .err{color:var(--ng);font-size:13px;min-height:18px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>카메라 인식 테스트</h1>
  <span class="tag" id="modelTag">모델 확인 중…</span>
  <span class="tag" id="threshTag"></span>
</header>
<main>
  <section class="card">
    <div class="stage" id="stage">
      <video id="video" playsinline muted hidden></video>
      <img id="still" alt="" hidden>
      <svg id="overlay" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="placeholder" id="placeholder">‘카메라 켜기’를 누르거나 사진을 올려 주세요</div>
    </div>
    <div class="controls">
      <select id="srcSelect" aria-label="카메라 종류">
        <option value="server">노트북 USB 웹캠 (서버)</option>
        <option value="browser">이 기기 카메라 (브라우저)</option>
      </select>
      <select id="idxSelect" aria-label="웹캠 번호"></select>
      <select id="camSelect" aria-label="브라우저 카메라" hidden></select>
      <button class="primary" id="camBtn">카메라 켜기</button>
      <button id="snapBtn" disabled>한 장 인식</button>
      <label class="row"><input type="checkbox" id="autoChk"> 자동 인식</label>
      <label class="row" id="roiRow" hidden><input type="checkbox" id="roiChk" checked> 판정 구역만</label>
      <label class="btn" for="fileIn">사진 찍어 올리기</label>
      <input type="file" id="fileIn" accept="image/*" capture="environment">
    </div>
    <div class="note" id="secureNote" hidden></div>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <div class="badge" id="badge"><div class="code" id="code">-</div><div class="name" id="codeName">결과 대기</div></div>
    <div class="meta"><span id="clsText"></span><span id="msText"></span></div>
    <h2>상위 클래스</h2>
    <div id="bars"></div>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2 style="margin-top:0">최근 인식 기록</h2>
    <div class="history" id="history"></div>
  </section>
</main>
<script>
// 판정 코드·클래스 이름 (docs/spec/modes_and_states.md 4절)
const CODES={OK:["투명 적합","--ok"],NG:["부적합 (라벨)","--ng"],CO:["기타 (유색)","--co"],RE:["재검사","--re"]};
const CLASS_KO={clear_nolabel:"투명·라벨 없음",clear_label:"투명·라벨 있음",color_nolabel:"유색·라벨 없음",color_label:"유색·라벨 있음"};
const HISTORY_MAX=12, SEND_WIDTH_MAX=1280, JPEG_Q=0.85, PREVIEW_GAP_MS=60;
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// 이 브라우저에서만 기억하는 편의 설정 (막혀 있어도 동작에는 지장 없음)
const pref={get(k){try{return localStorage.getItem("webtest."+k);}catch(e){return null;}},
            set(k,v){try{localStorage.setItem("webtest."+k,v);}catch(e){}}};

let info=null, stream=null, timer=null, busy=false;
let serverOn=false, lastBlob=null, previewUrl=null;
const video=$("video"), still=$("still"), canvas=document.createElement("canvas");
const isLocal=["localhost","127.0.0.1"].includes(location.hostname);
const source=()=>$("srcSelect").value;
const running=()=>!!stream||serverOn;

async function loadInfo(){
  try{
    info=await (await fetch("/api/info")).json();
    $("modelTag").textContent=info.custom?`모델: ${info.model} (4클래스 판정)`:`모델: ${info.model} (기본 모델 · 판정 코드 없음)`;
    $("threshTag").textContent=info.custom?`재검사 기준 신뢰도 < ${info.conf_threshold}`:"학습 모델을 넣으면 OK/NG/CO/RE로 표시";
    $("roiRow").hidden=!info.roi;
    $("idxSelect").innerHTML=info.camera_indexes.map(i=>`<option value="${i}">웹캠 ${i}번</option>`).join("");
    $("idxSelect").value=pref.get("index")??info.camera_index;
  }catch(e){$("modelTag").textContent="서버 연결 안 됨";}
}

function updateSourceUi(){
  const srv=source()==="server";
  $("idxSelect").hidden=!srv;
  $("camSelect").hidden=srv||$("camSelect").options.length<2;
  const blocked=!srv&&(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia);
  $("secureNote").hidden=!blocked;
  $("secureNote").textContent=blocked?"이 주소(http)에서는 브라우저가 실시간 카메라를 막습니다. ‘사진 찍어 올리기’를 쓰거나, 노트북에서 py -m vision.webtest --https 로 실행한 뒤 https 주소로 접속하세요.":"";
  $("camBtn").disabled=blocked;
}

// ---------- 노트북 USB 웹캠 (서버가 OpenCV로 읽음, 브라우저 권한 필요 없음) ----------
async function serverLoop(){
  if(!serverOn)return;
  try{
    const res=await fetch(`/api/server_camera/frame.jpg?index=${$("idxSelect").value}&t=${Date.now()}`);
    if(!res.ok)throw new Error((await res.json().catch(()=>({}))).detail||`서버 오류 ${res.status}`);
    const blob=await res.blob();
    if(!serverOn)return;
    lastBlob=blob;
    const url=URL.createObjectURL(blob);
    still.src=url; if(previewUrl)URL.revokeObjectURL(previewUrl); previewUrl=url;
    if(still.hidden){still.hidden=false;$("placeholder").hidden=true;}
    $("err").textContent="";
    setTimeout(serverLoop,PREVIEW_GAP_MS);
  }catch(e){
    $("err").textContent=e.message+" — 다른 번호를 고르거나, 웹캠을 쓰는 다른 프로그램(줌·카메라 앱·브라우저 탭)을 닫아 주세요.";
    stopCamera();
  }
}

function startServer(){
  serverOn=true; lastBlob=null;
  $("camBtn").textContent="카메라 끄기"; $("snapBtn").disabled=false;
  serverLoop();
  if($("autoChk").checked)startAuto();
}

// ---------- 이 기기 카메라 (브라우저, 휴대폰용) ----------
async function listCameras(current){
  const cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
  const sel=$("camSelect");
  sel.innerHTML=cams.map((c,i)=>`<option value="${esc(c.deviceId)}">${esc(c.label||"카메라 "+(i+1))}</option>`).join("");
  if(current)sel.value=current;
  updateSourceUi();
}

async function startBrowser(deviceId){
  deviceId=deviceId||pref.get("deviceId");
  // 휴대폰은 기본으로 후면 카메라, 해상도는 판정 웹캠(1280×720)에 맞춤
  const base={width:{ideal:1280},height:{ideal:720}};
  const want=deviceId?{...base,deviceId:{exact:deviceId}}:{...base,facingMode:{ideal:"environment"}};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:want,audio:false});
  }catch(e){
    if(!deviceId||e.name==="NotAllowedError")throw e;
    stream=await navigator.mediaDevices.getUserMedia({video:base,audio:false});   // 기억한 카메라가 빠졌으면 아무거나
  }
  video.srcObject=stream; await video.play();
  video.hidden=false; still.hidden=true; $("placeholder").hidden=true;
  $("camBtn").textContent="카메라 끄기"; $("snapBtn").disabled=false;
  const id=stream.getVideoTracks()[0].getSettings().deviceId;
  if(id)pref.set("deviceId",id);
  await listCameras(id);
  drawRoi(video.videoWidth,video.videoHeight,null);
  if($("autoChk").checked)startAuto();
}

function cameraError(e){
  if(e.name==="NotAllowedError")
    return "브라우저가 카메라를 막았습니다. 주소창 왼쪽 아이콘 → 사이트 설정 → 카메라 ‘허용’ → 새로고침. 노트북 USB 웹캠이면 ‘노트북 USB 웹캠 (서버)’을 쓰면 권한이 필요 없습니다.";
  if(e.name==="NotReadableError")
    return "카메라를 다른 프로그램이 쓰고 있습니다. 서버 모드나 다른 앱을 끄고 다시 시도하세요.";
  if(e.name==="NotFoundError"||e.name==="OverconstrainedError")
    return "카메라를 찾을 수 없습니다.";
  return "카메라를 열 수 없습니다: "+e.message;
}

// ---------- 공통 ----------
async function startCamera(){
  stopCamera();
  $("err").textContent="";
  if(source()==="server")startServer();
  else await startBrowser();
}

function stopCamera(){
  stopAuto();
  serverOn=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.hidden=true; $("camBtn").textContent="카메라 켜기"; $("snapBtn").disabled=true;
}

function frameToBlob(src,w,h){
  const scale=Math.min(1,SEND_WIDTH_MAX/w);
  canvas.width=Math.round(w*scale); canvas.height=Math.round(h*scale);
  canvas.getContext("2d").drawImage(src,0,0,canvas.width,canvas.height);
  return new Promise(r=>canvas.toBlob(r,"image/jpeg",JPEG_Q));
}

async function recognize(blob){
  if(busy)return; busy=true;
  try{
    const useRoi=info?.roi&&$("roiChk").checked?1:0;
    const res=await fetch(`/api/predict?roi=${useRoi}`,{method:"POST",headers:{"Content-Type":"image/jpeg"},body:blob});
    if(!res.ok)throw new Error((await res.json().catch(()=>({}))).detail||`서버 오류 ${res.status}`);
    const r=await res.json();
    $("err").textContent="";
    showResult(r); addHistory(blob,r);
    drawRoi(r.size[0],r.size[1],r.roi);
  }catch(e){$("err").textContent="인식 실패: "+e.message;}
  finally{busy=false;}
}

async function snap(){
  if(serverOn){if(lastBlob)await recognize(lastBlob);return;}   // 서버 웹캠은 이미 받은 원본 화면 그대로
  if(!stream||!video.videoWidth)return;
  await recognize(await frameToBlob(video,video.videoWidth,video.videoHeight));
}

function startAuto(){stopAuto();const ms=info?.interval_ms||500;const tick=async()=>{await snap();if(running())timer=setTimeout(tick,ms);};tick();}
function stopAuto(){clearTimeout(timer);timer=null;}

function label(c){return CLASS_KO[c]?`${CLASS_KO[c]} (${c})`:c;}

function showResult(r){
  const b=$("badge");
  if(r.code){
    const [name,color]=CODES[r.code];
    $("code").textContent=r.code; $("codeName").textContent=name; b.style.background=css(color);
  }else{
    $("code").textContent=`${(r.conf*100).toFixed(0)}%`; $("codeName").textContent=r.cls||"-"; b.style.background=css("--accent");
  }
  $("clsText").textContent=r.cls?`1위: ${label(r.cls)}`:"";
  $("msText").textContent=`${r.size[0]}×${r.size[1]} · ${r.ms} ms`;
  $("bars").innerHTML=r.top.map(t=>`<div class="bar"><div class="lbl"><span>${esc(label(t.cls))}</span><span>${(t.conf*100).toFixed(1)}%</span></div><div class="track"><div class="fill" style="width:${(t.conf*100).toFixed(1)}%"></div></div></div>`).join("");
}

function addHistory(blob,r){
  const url=URL.createObjectURL(blob);
  const color=r.code?css(CODES[r.code][1]):css("--line");
  const fig=document.createElement("figure");
  fig.innerHTML=`<img src="${url}" alt="" style="border-color:${color}"><figcaption>${esc(r.code?r.code+" · ":"")}${esc(r.cls)} ${(r.conf*100).toFixed(0)}%</figcaption>`;
  const h=$("history"); h.prepend(fig);
  while(h.children.length>HISTORY_MAX){URL.revokeObjectURL(h.lastChild.querySelector("img").src);h.lastChild.remove();}
}

// 판정 구역(ROI) 상자를 사진 위에 그린다. 좌표는 서버가 받은 사진 픽셀 기준
function drawRoi(w,h,roi){
  const svg=$("overlay");
  svg.setAttribute("viewBox",`0 0 ${w||1} ${h||1}`);
  const r=roi||(info?.roi&&$("roiChk").checked?info.roi:null);
  svg.innerHTML=r?`<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="none" stroke="#facc15" stroke-width="${Math.max(2,w/320)}" stroke-dasharray="12 6"/>`:"";
}

$("camBtn").onclick=async()=>{
  if(running()){stopCamera();return;}
  try{await startCamera();}catch(e){stopCamera();$("err").textContent=cameraError(e);}
};
$("srcSelect").onchange=e=>{pref.set("source",e.target.value);stopCamera();updateSourceUi();};
$("idxSelect").onchange=e=>{pref.set("index",e.target.value);if(serverOn){lastBlob=null;$("err").textContent="";}};
$("camSelect").onchange=e=>{pref.set("deviceId",e.target.value);stopCamera();startBrowser(e.target.value).catch(err=>$("err").textContent=cameraError(err));};
$("snapBtn").onclick=snap;
$("autoChk").onchange=e=>{if(e.target.checked&&running())startAuto();else stopAuto();};
$("roiChk").onchange=()=>drawRoi(video.videoWidth||still.naturalWidth,video.videoHeight||still.naturalHeight,null);
$("fileIn").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  stopCamera();
  const img=new Image(); img.src=URL.createObjectURL(f); await img.decode();
  still.src=img.src; still.hidden=false; $("placeholder").hidden=true;
  await recognize(await frameToBlob(img,img.naturalWidth,img.naturalHeight));
  e.target.value="";
};

// 노트북에서 열면 USB 웹캠(서버)이 기본, 휴대폰에서 열면 이 기기 카메라가 기본
$("srcSelect").value=pref.get("source")||(isLocal?"server":"browser");
updateSourceUi(); loadInfo();
</script>
</body>
</html>
