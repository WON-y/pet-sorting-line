<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페트병 선별 라인 대시보드</title>
<style>
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f6f7f9;color:#1f2328}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;background:#fff;border-bottom:1px solid #d9dde3}
  h1{font-size:19px;margin:0}
  #lamp{width:18px;height:18px;border-radius:50%;background:#9ca3af}
  #stateText{font-weight:700}
  main{max-width:1100px;margin:0 auto;padding:18px 22px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .card{background:#fff;border:1px solid #d9dde3;border-radius:8px;padding:12px 14px}
  .v{font-size:28px;font-weight:700}.l{font-size:13px;color:#5f6670}
  h2{font-size:16px;margin:22px 0 8px}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
  th,td{border-bottom:1px solid #eceff3;padding:6px 8px;text-align:left}
  th{background:#eceff3}
  .STOP{color:#b42318;font-weight:700}.WARN{color:#8a5a00;font-weight:700}.RUN{color:#2e7d5a;font-weight:700}
</style>
</head>
<body>
<header>
  <div id="lamp"></div>
  <h1>페트병 선별 라인</h1>
  <span id="stateText">연결 대기</span>
  <span class="l" id="modeText"></span>
</header>
<main>
  <div class="grid">
    <div class="card"><div class="v" id="ok">0</div><div class="l">투명 적합 (OK)</div></div>
    <div class="card"><div class="v" id="ng">0</div><div class="l">부적합 (NG)</div></div>
    <div class="card"><div class="v" id="co">0</div><div class="l">기타 (CO)</div></div>
    <div class="card"><div class="v" id="re">0</div><div class="l">재검사 (RE) · <span id="rr">0%</span></div></div>
  </div>
  <div class="grid" style="margin-top:12px">
    <div class="card"><div class="v" id="stops">0</div><div class="l">위험 정지</div></div>
    <div class="card"><div class="v" id="nearMiss">0</div><div class="l">아차사고 (경고 + 정지)</div></div>
    <div class="card"><div class="v" id="total">0</div><div class="l">판정한 병</div></div>
    <div class="card"><div class="v" id="danger">-</div><div class="l">안전 단계</div></div>
  </div>
  <h2>최근 이벤트</h2>
  <table><thead><tr><th>시각</th><th>종류</th><th>병</th><th>내용</th></tr></thead><tbody id="events"></tbody></table>
</main>
<script>
const COLORS={AUTO:"#2e7d5a",SLOW:"#d4a017",WARN:"#d4a017",LOCKOUT:"#b42318",STOP:"#b42318"};
const NAMES={AUTO:"자동 운전",SLOW:"저속",WARN:"접근 경고",LOCKOUT:"점검 잠금",STOP:"위험 정지"};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function refresh(){
  try{
    const s=await (await fetch("/api/summary")).json();
    $("ok").textContent=s.bins.OK;$("ng").textContent=s.bins.NG;$("co").textContent=s.bins.CO;$("re").textContent=s.bins.RE;
    $("rr").textContent=(s.recheck_rate*100).toFixed(1)+"%";$("stops").textContent=s.stops;$("nearMiss").textContent=s.near_miss;$("total").textContent=s.total;
    const st=s.state||{};const key=st.state||"";
    $("lamp").style.background=COLORS[key]||"#9ca3af";$("stateText").textContent=NAMES[key]||"상태 없음";
    $("modeText").textContent=st.mode?`모드 ${st.mode} · 벨트 ${st.run}`:"";$("danger").textContent=st.danger??"-";
    const ev=await (await fetch("/api/events?limit=20")).json();
    $("events").innerHTML=ev.map(e=>`<tr><td>${(e.ts||"").slice(11,19)}</td><td class="${esc(e.type)}">${esc(e.type)}</td><td>${e.bottle??""}</td><td>${esc(JSON.stringify(e.payload).slice(0,90))}</td></tr>`).join("");
  }catch(err){$("stateText").textContent="대시보드 서버 연결 안 됨";}
}
refresh();setInterval(refresh,2000);
</script>
</body>
</html>
